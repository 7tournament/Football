<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⬛ YOUR IP · lil bro</title>
    <!-- simple, each visitor sees their own IP and location -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #030303;
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background-image: radial-gradient(rgba(0, 255, 0, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .ip-box {
            max-width: 750px;
            width: 100%;
            background: #0b0f0b;
            border: 2px solid #1f9a1f;
            border-radius: 2rem;
            box-shadow: 0 0 30px #1f9a1f55, 0 15px 40px #000000dd;
            padding: 2.2rem 2.5rem;
            color: #b3ffb3;
        }
        .ip-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid #2b9e2b;
            padding-bottom: 1rem;
        }
        .ip-header i {
            font-size: 2.2rem;
            color: #22ff22;
            text-shadow: 0 0 12px #0f0;
        }
        .ip-header h2 {
            font-weight: 500;
            font-size: 2rem;
            color: #d0ffd0;
            text-transform: uppercase;
            text-shadow: 0 0 5px #0f0;
        }
        .live-badge {
            margin-left: auto;
            background: #143014;
            padding: 0.4rem 1.4rem;
            border-radius: 40px;
            border: 1px solid #2aff2a;
            color: #b0ffb0;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 1px;
        }
        .info-row {
            display: flex;
            align-items: baseline;
            padding: 0.75rem 0;
            border-bottom: 1px dashed #226622;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .info-label {
            width: 130px;
            font-size: 1rem;
            font-weight: 500;
            color: #55ff55;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            text-shadow: 0 0 4px #1f9a1f;
        }
        .info-value {
            font-weight: 500;
            font-size: 1.3rem;
            color: #ffffff;
            word-break: break-word;
            flex: 1;
            text-shadow: 0 0 8px #3aff3a;
        }
        .info-value small {
            font-size: 0.8rem;
            font-weight: 400;
            background: #1b3b1b;
            padding: 0.2rem 0.9rem;
            border-radius: 30px;
            margin-left: 1rem;
            color: #aaffaa;
            border: 1px solid #2aff2a;
        }
        .extra-row {
            margin-top: 1.8rem;
            background: #0e1a0e;
            border-radius: 1.5rem;
            padding: 1.2rem 1.8rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 2rem;
            border: 1px solid #2b9e2b;
        }
        .extra-item {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            color: #b5ffb5;
            font-size: 1rem;
        }
        .extra-item i {
            color: #22ff22;
            width: 1.8rem;
            text-align: center;
            font-size: 1.3rem;
            filter: drop-shadow(0 0 6px #0f0);
        }
        .refresh-btn {
            background: #102010;
            border: 2px solid #29cf29;
            color: #b0ffb0;
            padding: 0.9rem 2rem;
            border-radius: 3rem;
            font-weight: 600;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 2rem;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 20px #0f0b0f;
        }
        .refresh-btn:hover {
            background: #1f3a1f;
            border-color: #4aff4a;
            color: #ffffff;
            box-shadow: 0 0 35px #2aff2a;
            transform: scale(1.02);
        }
        .loading {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #8aff8a;
        }
        .spinner {
            width: 18px;
            height: 18px;
            border: 3px solid #284f28;
            border-top-color: #22ff22;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footnote {
            margin-top: 1.5rem;
            text-align: center;
            color: #4f8a4f;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="ip-box">
        <div class="ip-header">
            <i class="fas fa-user-secret"></i>
            <h2>➤ this you lil bro</h2>
            <span class="live-badge"><i class="fas fa-circle" style="color:#2aff2a; font-size:0.7rem;"></i> wyd here lil chick</span>
        </div>

        <!-- IP address row -->
        <div class="info-row">
            <span class="info-label"><i class="fas fa-fingerprint"></i> IPv4</span>
            <span class="info-value" id="ipv4Display">
                <span class="loading"><span class="spinner"></span> detecting...</span>
            </span>
        </div>
        <div class="info-row">
            <span class="info-label"><i class="fas fa-city"></i> city</span>
            <span class="info-value" id="cityDisplay">—</span>
        </div>
        <div class="info-row">
            <span class="info-label"><i class="fas fa-map-pin"></i> region</span>
            <span class="info-value" id="regionDisplay">—</span>
        </div>
        <div class="info-row">
            <span class="info-label"><i class="fas fa-flag"></i> country</span>
            <span class="info-value" id="countryDisplay">—</span>
        </div>
        <div class="info-row">
            <span class="info-label"><i class="fas fa-mail-bulk"></i> postal</span>
            <span class="info-value" id="postalDisplay">—</span>
        </div>
        <div class="info-row">
            <span class="info-label"><i class="fas fa-map-marked-alt"></i> coordinates</span>
            <span class="info-value" id="coordDisplay">—</span>
        </div>

        <!-- extra: timezone, ISP, ASN -->
        <div class="extra-row">
            <div class="extra-item">
                <i class="fas fa-clock"></i>
                <span id="timezoneDisplay">⏳ acquiring...</span>
            </div>
            <div class="extra-item">
                <i class="fas fa-building"></i>
                <span id="ispDisplay">—</span>
            </div>
            <div class="extra-item">
                <i class="fas fa-diagram-project"></i>
                <span id="asnDisplay">—</span>
            </div>
        </div>

        <!-- refresh button -->
        <button class="refresh-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i> refresh your data</button>

        <!-- note explaining it's the visitor's own IP -->
        <div class="footnote">
            ⚡ This is <strong>made</strong> by mace, voident.
        </div>
    </div>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script>
        (function() {
            const ipv4Span = document.getElementById('ipv4Display');
            const citySpan = document.getElementById('cityDisplay');
            const regionSpan = document.getElementById('regionDisplay');
            const countrySpan = document.getElementById('countryDisplay');
            const postalSpan = document.getElementById('postalDisplay');
            const coordSpan = document.getElementById('coordDisplay');
            const timezoneSpan = document.getElementById('timezoneDisplay');
            const ispSpan = document.getElementById('ispDisplay');
            const asnSpan = document.getElementById('asnDisplay');
            const refreshBtn = document.getElementById('refreshBtn');

            function setLoading() {
                ipv4Span.innerHTML = '<span class="loading"><span class="spinner"></span> detecting...</span>';
                citySpan.textContent = '—';
                regionSpan.textContent = '—';
                countrySpan.textContent = '—';
                postalSpan.textContent = '—';
                coordSpan.textContent = '—';
                timezoneSpan.textContent = '⏳ acquiring...';
                ispSpan.textContent = '—';
                asnSpan.textContent = '—';
            }

            function updateUI(data) {
                const ip = data.ip || '—';
                ipv4Span.innerHTML = `${ip} <small>IPv4</small>`;

                citySpan.textContent = data.city || '—';
                regionSpan.textContent = data.region || data.region_code || '—';
                countrySpan.textContent = data.country_name || data.country || '—';
                postalSpan.textContent = data.postal || data.postal_code || '—';

                if (data.latitude && data.longitude) {
                    coordSpan.textContent = `${data.latitude}, ${data.longitude}`;
                } else if (data.lat && data.lon) {
                    coordSpan.textContent = `${data.lat}, ${data.lon}`;
                } else if (data.loc) {
                    coordSpan.textContent = data.loc;
                } else {
                    coordSpan.textContent = '—';
                }

                timezoneSpan.textContent = data.timezone || data.tz || '—';
                ispSpan.textContent = data.org || data.isp || data.organization || '—';
                if (data.asn || data.as) {
                    asnSpan.textContent = `AS${data.asn || data.as}`;
                } else {
                    asnSpan.textContent = '—';
                }
            }

            function showError() {
                ipv4Span.innerHTML = `<span style="color:#ff8888;">⚠️ failed to load</span>`;
                citySpan.textContent = '—';
                regionSpan.textContent = '—';
                countrySpan.textContent = '—';
                postalSpan.textContent = '—';
                coordSpan.textContent = '—';
                timezoneSpan.textContent = '—';
                ispSpan.textContent = '—';
                asnSpan.textContent = '—';
            }

            function fetchIPData() {
                setLoading();

                // Try primary API (ipapi.co)
                fetch('https://ipapi.co/json/')
                    .then(response => {
                        if (!response.ok) throw new Error('ipapi failed');
                        return response.json();
                    })
                    .then(data => {
                        updateUI(data);
                    })
                    .catch(() => {
                        // Fallback to ipinfo.io
                        fetch('https://ipinfo.io/json?token=')
                            .then(res => res.json())
                            .then(ipinfo => {
                                const adapted = {
                                    ip: ipinfo.ip,
                                    city: ipinfo.city,
                                    region: ipinfo.region,
                                    country_name: ipinfo.country,
                                    postal: ipinfo.postal,
                                    timezone: ipinfo.timezone,
                                    org: ipinfo.org,
                                };
                                if (ipinfo.loc) {
                                    const [lat, lon] = ipinfo.loc.split(',');
                                    adapted.latitude = lat;
                                    adapted.longitude = lon;
                                }
                                if (ipinfo.org) {
                                    const match = ipinfo.org.match(/AS(\d+)/);
                                    if (match) adapted.asn = match[1];
                                }
                                updateUI(adapted);
                            })
                            .catch(() => {
                                showError();
                            });
                    });
            }

            fetchIPData();
            refreshBtn.addEventListener('click', (e) => {
                e.preventDefault();
                fetchIPData();
            });
        })();
    </script>
</body>
</html>
